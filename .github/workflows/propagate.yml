name: "Central Governance Propagation"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_repos:
        description: "Target repositories to propagate (e.g. 'all', 'local', or comma-separated list like 'repo1,repo2')"
        required: false
        type: string
        default: "all"
      dry_run:
        description: "Run propagation in dry-run mode"
        required: false
        type: boolean
        default: false
      direct_commit:
        description: "Commit directly to main without creating PR"
        required: false
        type: boolean
        default: false

jobs:
  propagate:
    name: "Propagate Standards across Repositories"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repokit
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build repokit
        run: |
          go build -o bin/repokit ./cmd/repokit

      - name: Execute repokit configure
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ -z "$GH_PAT" ]; then
            echo "No GH_PAT secret configured; skipping automated release propagation to prevent cross-repo auth failures. Configure GH_PAT in repository secrets or trigger manually via workflow_dispatch."
            exit 0
          fi

          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGETS="${{ inputs.target_repos }}"
          if [ -z "$TARGETS" ]; then
            TARGETS="all"
          fi

          ARGS=""
          if [ "$TARGETS" = "all" ]; then
            ARGS="--all"
          elif [ "$TARGETS" = "local" ]; then
            ARGS="--local"
          else
            ARGS="--repos $TARGETS"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ "${{ inputs.direct_commit }}" = "true" ]; then
            ARGS="$ARGS --direct --force"
          elif [ "${{ inputs.direct_commit }}" = "false" ] || [ "$GITHUB_EVENT_NAME" = "release" ]; then
            ARGS="$ARGS --pr --force --wait-for-merge"
          fi

          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -n "$RELEASE_TAG" ]; then
            ARGS="$ARGS --release-ref $RELEASE_TAG"
          fi

          echo "Running: ./bin/repokit configure $ARGS"
          ./bin/repokit configure $ARGS
