name: "Reusable Python CI"

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to set up"
        required: false
        type: string
        default: "3.11"
      min-coverage:
        description: "Minimum code coverage percentage required"
        required: false
        type: number
        default: 80

jobs:
  test:
    name: "Quality Gate / Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Verify Release Candidate
        if: github.head_ref == 'release-staging' || startsWith(github.head_ref, 'release-')
        run: |
          python -m pip install --upgrade pip
          pip install build pytest
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install .
            python -m build
          fi
          pytest -v

      - name: Install development dependencies
        if: github.head_ref != 'release-staging' && !startsWith(github.head_ref, 'release-')
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e .
          fi

      - name: Run ruff lint & format check
        if: github.head_ref != 'release-staging' && !startsWith(github.head_ref, 'release-')
        continue-on-error: true
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest with coverage
        if: github.head_ref != 'release-staging' && !startsWith(github.head_ref, 'release-')
        run: |
          pytest --cov=src --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" --cov-fail-under=${{ inputs.min-coverage }}

      - name: Update Outstanding Bot PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BOT_PRS=$(gh pr list --head "bot/" --state open --json number -q '.[].number' 2>/dev/null || true)
          for pr in $BOT_PRS; do
            echo "Updating bot PR #$pr with latest main..."
            gh api --method PUT "repos/${{ github.repository }}/pulls/$pr/update-branch" || true
          done

