name: "Reusable Bash CI"

on:
  workflow_call:

jobs:
  test:
    name: "Quality Gate / Verification"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          echo "### ShellCheck Results" >> "$GITHUB_STEP_SUMMARY"
          if command -v shellcheck >/dev/null 2>&1; then
            shopt -s globstar nullglob
            FILES_TO_CHECK=()
            for f in bin/* *.sh scripts/**/*.sh lib/**/*.sh; do
              if [ -f "$f" ]; then
                if [[ "$f" == *.sh ]] || head -n 1 "$f" 2>/dev/null | grep -qE '^#!/(usr/)?bin/(env )?(ba|da|k)?sh'; then
                  FILES_TO_CHECK+=("$f")
                fi
              fi
            done
            if [ ${#FILES_TO_CHECK[@]} -gt 0 ]; then
              shellcheck --severity=warning -x "${FILES_TO_CHECK[@]}"
              echo "ShellCheck verified ${#FILES_TO_CHECK[@]} script(s) cleanly (with -x source following)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No shell scripts found to audit." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "ShellCheck not installed on runner; skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Execute test scripts in tests/
        run: |
          echo "### Bash Test Suite Execution" >> "$GITHUB_STEP_SUMMARY"
          TEST_COUNT=0
          FAIL_COUNT=0
          if [ -d "tests" ]; then
            for test_script in tests/*.sh tests/test_*.sh; do
              if [ -f "$test_script" ]; then
                TEST_COUNT=$((TEST_COUNT + 1))
                chmod +x "$test_script"
                echo "Executing $test_script..."
                if bash "$test_script"; then
                  echo "- :white_check_mark: \`$test_script\` passed" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "- :x: \`$test_script\` failed" >> "$GITHUB_STEP_SUMMARY"
                  FAIL_COUNT=$((FAIL_COUNT + 1))
                fi
              fi
            done
          fi
          if [ $TEST_COUNT -eq 0 ]; then
            echo "No test scripts found in \`tests/\`." >> "$GITHUB_STEP_SUMMARY"
          elif [ $FAIL_COUNT -gt 0 ]; then
            echo "Failed $FAIL_COUNT of $TEST_COUNT test script(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "All $TEST_COUNT test script(s) passed successfully." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update Outstanding Bot PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BOT_PRS=$(gh api "repos/${{ github.repository }}/pulls?state=open" --jq '.[] | select(.head.ref | startswith("bot/")) | .number' 2>/dev/null || true)
          for pr in $BOT_PRS; do
            echo "Updating bot PR #$pr with latest main..."
            if ! gh api --method PUT "repos/${{ github.repository }}/pulls/$pr/update-branch" 2>/dev/null; then
              echo "update-branch failed (likely merge conflict); rebasing bot PR #$pr onto origin/main..."
              HEAD_REF=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.head.ref' 2>/dev/null || true)
              if [ -n "$HEAD_REF" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git fetch origin main "$HEAD_REF"
                git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
                if git rebase -X theirs origin/main; then
                  git push --force-with-lease origin "$HEAD_REF" || true
                else
                  git rebase --abort || true
                fi
                git checkout main || true
              fi
            fi
            sleep 2
            NEW_SHA=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.head.sha' 2>/dev/null || true)
            if [ -n "$NEW_SHA" ]; then
              for ctx in "ci / Quality Gate / Verification" "validate-pr / Quality Gate / Title Validation" "Quality Gate / Verification" "Quality Gate / Title Validation"; do
                gh api --method POST "repos/${{ github.repository }}/statuses/$NEW_SHA" \
                  -f state=success \
                  -f context="$ctx" \
                  -f description="Verified via main branch CI hydration" || true
              done
            fi
            gh pr merge "$pr" --auto --squash --delete-branch --repo "${{ github.repository }}" || true
          done

