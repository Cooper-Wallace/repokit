name: "Reusable Release Preparation"

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Target branch for release promotion (default: main)"
        type: string
        default: "main"
        required: false
      staging-branch:
        description: "Candidate staging branch (default: release-staging)"
        type: string
        default: "release-staging"
        required: false
      release-type:
        description: "Legacy release type input (deprecated, preserved for backwards compatibility)"
        type: string
        default: ""
        required: false
      token:
        description: "GitHub Token or PAT for release authentication"
        type: string
        required: false
        default: ""
    outputs:
      releases_created:
        description: "Whether a release was created"
        value: ${{ jobs.release-prep.outputs.releases_created }}
      tag_name:
        description: "Release tag name"
        value: ${{ jobs.release-prep.outputs.tag_name }}
      version:
        description: "Release version"
        value: ${{ jobs.release-prep.outputs.version }}
      major:
        description: "Major version"
        value: ${{ jobs.release-prep.outputs.major }}
      minor:
        description: "Minor version"
        value: ${{ jobs.release-prep.outputs.minor }}
      patch:
        description: "Patch version"
        value: ${{ jobs.release-prep.outputs.patch }}

jobs:
  release-prep:
    name: "Release Preparation"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ inputs.token != '' && inputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run repokit release
        id: release
        env:
          GH_TOKEN: ${{ inputs.token != '' && inputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ inputs.token != '' && inputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="${{ inputs.target-branch || 'main' }}"
          STAGING_BRANCH="${{ inputs.staging-branch || 'release-staging' }}"

          if [ -d "cmd/repokit" ]; then
            echo "Running local repokit CLI..."
            go run ./cmd/repokit release --target-branch "$TARGET_BRANCH" --staging-branch "$STAGING_BRANCH"
          else
            echo "Installing repokit from Cooper-Wallace/repokit@main..."
            go install github.com/Cooper-Wallace/repokit/cmd/repokit@main
            repokit release --target-branch "$TARGET_BRANCH" --staging-branch "$STAGING_BRANCH"
          fi
