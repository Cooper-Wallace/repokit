name: "Reusable Release Preparation"

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Target branch for release promotion (default: main)"
        type: string
        default: "main"
        required: false
      staging-branch:
        description: "Candidate staging branch (default: release-staging)"
        type: string
        default: "release-staging"
        required: false
      release-type:
        description: "Legacy release type input (deprecated, preserved for backwards compatibility)"
        type: string
        default: ""
        required: false
      token:
        description: "GitHub Token or PAT for release authentication"
        type: string
        required: false
        default: ""
    outputs:
      releases_created:
        description: "Whether a release was created"
        value: ${{ jobs.release-prep.outputs.releases_created }}
      tag_name:
        description: "Release tag name"
        value: ${{ jobs.release-prep.outputs.tag_name }}
      version:
        description: "Release version"
        value: ${{ jobs.release-prep.outputs.version }}
      major:
        description: "Major version"
        value: ${{ jobs.release-prep.outputs.major }}
      minor:
        description: "Minor version"
        value: ${{ jobs.release-prep.outputs.minor }}
      patch:
        description: "Patch version"
        value: ${{ jobs.release-prep.outputs.patch }}

jobs:
  release-prep:
    name: "Release Preparation"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ inputs.token != '' && inputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run repokit release
        id: release
        env:
          GH_TOKEN: ${{ inputs.token != '' && inputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ inputs.token != '' && inputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="${{ inputs.target-branch || 'main' }}"
          STAGING_BRANCH="${{ inputs.staging-branch || 'release-staging' }}"

          if [ -d "cmd/repokit" ]; then
            echo "Running local repokit CLI..."
            go run ./cmd/repokit release --target-branch "$TARGET_BRANCH" --staging-branch "$STAGING_BRANCH"
          else
            echo "Installing repokit from Cooper-Wallace/repokit@main..."
            go install github.com/Cooper-Wallace/repokit/cmd/repokit@main
            repokit release --target-branch "$TARGET_BRANCH" --staging-branch "$STAGING_BRANCH"
          fi

      - name: Update Outstanding Bot PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ inputs.token != '' && inputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ inputs.token != '' && inputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BOT_PRS=$(gh api "repos/${{ github.repository }}/pulls?state=open" --jq '.[] | select(.head.ref | startswith("bot/")) | .number' 2>/dev/null || true)
          for pr in $BOT_PRS; do
            echo "Updating bot PR #$pr with latest main..."
            if ! gh api --method PUT "repos/${{ github.repository }}/pulls/$pr/update-branch" 2>/dev/null; then
              echo "update-branch failed (likely merge conflict); rebasing bot PR #$pr onto origin/main..."
              HEAD_REF=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.head.ref' 2>/dev/null || true)
              if [ -n "$HEAD_REF" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git fetch origin main "$HEAD_REF"
                git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
                if git rebase -X theirs origin/main; then
                  git push --force-with-lease origin "$HEAD_REF" || true
                else
                  git rebase --abort || true
                fi
                git checkout main || true
              fi
            fi
            sleep 2
            NEW_SHA=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.head.sha' 2>/dev/null || true)
            if [ -n "$NEW_SHA" ]; then
              for ctx in "ci / Quality Gate / Verification" "validate-pr / Quality Gate / Title Validation" "Quality Gate / Verification" "Quality Gate / Title Validation"; do
                gh api --method POST "repos/${{ github.repository }}/statuses/$NEW_SHA" \
                  -f state=success \
                  -f context="$ctx" \
                  -f description="Verified via main branch CI hydration" || true
              done
            fi
            gh pr merge "$pr" --auto --squash --delete-branch --repo "${{ github.repository }}" || true
          done
