name: "Reusable TypeScript CI"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to set up"
        required: false
        type: string
        default: "20"
      min-coverage:
        description: "Minimum code coverage percentage required"
        required: false
        type: number
        default: 80

jobs:
  test:
    name: "Quality Gate / Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Verify Release Candidate
        if: github.head_ref == 'release-staging' || startsWith(github.head_ref, 'release-')
        run: |
          npm run build --if-present
          npm test --if-present

      - name: Typecheck
        if: github.head_ref != 'release-staging' && !startsWith(github.head_ref, 'release-')
        run: |
          npx tsc --noEmit

      - name: Lint
        if: github.head_ref != 'release-staging' && !startsWith(github.head_ref, 'release-')
        run: |
          npm run lint --if-present

      - name: Test with vitest coverage
        if: github.head_ref != 'release-staging' && !startsWith(github.head_ref, 'release-')
        run: |
          npx vitest run --coverage --coverage.thresholds.lines=${{ inputs.min-coverage }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        if: github.head_ref != 'release-staging' && !startsWith(github.head_ref, 'release-')
        run: |
          npm run build --if-present
