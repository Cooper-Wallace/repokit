name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "Semantic Release Gate"
    uses: ./.github/workflows/reusable-release-prep.yml
    with:
      release-type: "go"

  package-release:
    name: "Package & Upload Assets"
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/reusable-release-go.yml
    with:
      tag-name: ${{ needs.release-please.outputs.tag_name }}
      go-version: "1.23"
    secrets: inherit
