name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-stage:
    name: "Semantic Release Gate"
    uses: ./.github/workflows/reusable-release-prep.yml
    with:
      staging-branch: "release-staging"
      target-branch: "main"
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GH_PAT || github.token }}
    secrets: inherit

  package-release:
    name: "Package & Upload Assets"
    needs: release-stage
    if: ${{ needs.release-stage.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/reusable-release-go.yml
    with:
      tag-name: ${{ needs.release-stage.outputs.tag_name }}
      go-version: "1.23"
    secrets: inherit
