name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: {{governance_slug}}/.github/workflows/semantic-pr.yml@v1

  ci:
    uses: {{governance_slug}}/.github/workflows/reusable-go.yml@v1
    with:
      go-version: "1.23"
      min-coverage: 80
