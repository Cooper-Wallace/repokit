name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: {{governance_slug}}/.github/workflows/semantic-pr.yml@main

  ci:
    uses: {{governance_slug}}/.github/workflows/reusable-typescript.yml@main
    with:
      node-version: "20"
      min-coverage: 80
