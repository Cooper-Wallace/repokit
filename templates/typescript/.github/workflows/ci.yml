name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: {{governance_slug}}/.github/workflows/semantic-pr.yml@v1

  ci:
    uses: {{governance_slug}}/.github/workflows/reusable-typescript.yml@v1
    secrets: inherit
    with:
      node-version: "20"
      min-coverage: 80
