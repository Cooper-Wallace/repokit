name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "Semantic Release Gate"
    uses: {{governance_slug}}/.github/workflows/reusable-release-prep.yml@main
    with:
      release-type: "node"

  package-release:
    name: "Package & Upload Assets"
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: {{governance_slug}}/.github/workflows/reusable-release-typescript.yml@main
    with:
      tag-name: ${{ needs.release-please.outputs.tag_name }}
      node-version: "20"
