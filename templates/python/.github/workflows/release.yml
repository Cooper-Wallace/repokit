name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-stage:
    name: "Semantic Release Gate"
    uses: {{governance_slug}}/.github/workflows/reusable-release-prep.yml@main
    with:
      staging-branch: "release-staging"
      target-branch: "main"

  package-release:
    name: "Package & Upload Assets"
    needs: release-stage
    if: ${{ needs.release-stage.outputs.releases_created == 'true' }}
    uses: {{governance_slug}}/.github/workflows/reusable-release-python.yml@main
    with:
      tag-name: ${{ needs.release-stage.outputs.tag_name }}
      python-version: "3.11"
