name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "Semantic Release Gate"
    uses: {{governance_slug}}/.github/workflows/reusable-release-prep.yml@main
    with:
      release-type: "python"

  package-release:
    name: "Package & Upload Assets"
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: {{governance_slug}}/.github/workflows/reusable-release-python.yml@main
    with:
      tag-name: ${{ needs.release-please.outputs.tag_name }}
      python-version: "3.11"
