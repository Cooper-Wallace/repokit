name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: {{governance_slug}}/.github/workflows/reusable-python.yml@v1
    secrets: inherit
    with:
      python-version: "3.11"
      min-coverage: 80
