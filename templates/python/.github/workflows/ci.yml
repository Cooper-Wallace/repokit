name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    uses: cooperwallace/gh-standardise/.github/workflows/semantic-pr.yml@main

  ci:
    uses: cooperwallace/gh-standardise/.github/workflows/reusable-python.yml@main
    with:
      python-version: "3.11"
      min-coverage: 80
